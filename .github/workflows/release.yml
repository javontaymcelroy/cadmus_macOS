name: Release

# Push a version tag (git tag v0.1.2 && git push origin v0.1.2) to build a universal macOS
# .dmg and .zip and publish them as a GitHub Release. Bump "version" in package.json first.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      # Signing and notarization switch on by themselves once these repo secrets exist.
      # Without them the build is unsigned (electron-builder.config.cjs skips signing).
      HAS_SIGNING: ${{ secrets.CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - run: npm ci

      # Import the certificate into a temporary keychain ourselves; electron-builder's own
      # CSC_LINK import fails on the macOS runners (set-key-partition-list can't unlock it).
      # electron-builder then signs with CSC_NAME from the keychain search list.
      - name: Load signing secrets
        if: env.HAS_SIGNING == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kp=$(openssl rand -hex 16)
          security create-keychain -p "$kp" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kp" "$keychain"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          {
            echo "CSC_NAME=Javontay McElroy (M2L5UGJP7D)"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      # Signs and notarizes the app when the secrets above are loaded.
      - run: npm run build && npx electron-builder --mac --universal --config electron-builder.config.cjs --publish never

      # electron-builder notarizes the app but not the .dmg around it. Notarize and staple the
      # .dmg too, so a downloaded copy passes Gatekeeper offline.
      - name: Notarize the .dmg
        if: env.HAS_SIGNING == 'true'
        run: |
          dmg=$(ls dist/*.dmg)
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          spctl -a -t open --context context:primary-signature -vv "$dmg"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$HAS_SIGNING" = true ]; then
            NOTES='Download the .dmg below, open it, and drag Cadmus to Applications. It runs on Apple Silicon and Intel Macs.

          This build is signed with an Apple Developer ID and notarized by Apple, so it opens like any other app.'
          else
            NOTES='Download the .dmg below, open it, and drag Cadmus to Applications. It runs on Apple Silicon and Intel Macs.

          This build is not signed by Apple. The first time, right-click Cadmus in Applications and choose **Open**, then **Open** again. On macOS 15 and later, if there is no Open button, open Cadmus once, then click **Open Anyway** in System Settings → Privacy & Security.'
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip --title "Cadmus $GITHUB_REF_NAME" --notes "$NOTES"
